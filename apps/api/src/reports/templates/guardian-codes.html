<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Códigos para padres {{group}}</title>
    <style>
      @page {
        size: letter;
        margin: 0.5in;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        color: #1f2430;
        font-size: 10pt;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 12pt;
        color: #1f3a7a;
      }
      p.hint {
        margin: 0 0 10px;
        font-size: 9pt;
        color: #5a6275;
      }
      .strip {
        border: 1.5px dashed #6b7385;
        border-radius: 6px;
        padding: 8px 12px;
        margin-bottom: 10px;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: 'who code' 'steps code';
        column-gap: 16px;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .who {
        grid-area: who;
        font-size: 11pt;
      }
      .nl {
        display: inline-block;
        min-width: 22px;
        color: #5a6275;
      }
      .code {
        grid-area: code;
        align-self: center;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 20pt;
        font-weight: 700;
        letter-spacing: 2px;
        color: #1f3a7a;
        border: 2px solid #1f3a7a;
        border-radius: 6px;
        padding: 6px 12px;
      }
      ol {
        grid-area: steps;
        margin: 4px 0 0;
        padding-left: 18px;
        font-size: 9pt;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h1>{{school}} · Códigos para padres de familia · {{group}}</h1>
    <p class="hint">Recorta por la línea punteada y entrega cada tira a la familia del alumno.</p>
    {{strips}}
  </body>
</html>
